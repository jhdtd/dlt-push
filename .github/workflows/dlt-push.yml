name: 大乐透号码推送

on:
  schedule:
    # 定时任务设两个时段，配合「时间窗口守卫」抵消 GitHub 免费版的调度延迟：
    #  A. 周一/三/六 北京 12:00（UTC 04:00）—— 不延迟时准点推送
    #  B. 周日/二/五 UTC 20:00（= 周一/三/六 北京 04:00）—— 若延迟 7~8 小时，正好落在北京 11~12 点
    - cron: "0 4 * * 1,3,6"
    - cron: "0 20 * * 0,2,5"
  # 支持在 Actions 页面手动触发（手动触发不受时间窗口与去重限制）
  workflow_dispatch:
  # 供外部定时器（cron-job.org 等）精确触发
  repository_dispatch:
    types: [dlt-push]

permissions:
  contents: write        # 需要把图片提交回仓库，才能拿到公网外链

concurrency:
  group: dlt-push
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
      DLT_TITLE: 超级大乐透 · 机选 5 注
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装中文字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: 缓存历史开奖数据
        uses: actions/cache@v4
        with:
          path: state/history.json
          key: dlt-history-${{ github.run_id }}
          restore-keys: |
            dlt-history-

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 判断是否需要推送
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import datetime, json, os, pathlib

          tz = datetime.timezone(datetime.timedelta(hours=8))
          now = datetime.datetime.now(tz)
          today, hour = now.strftime("%Y-%m-%d"), now.hour
          last = ""
          p = pathlib.Path("state/last_push.json")
          if p.exists():
              try:
                  last = json.loads(p.read_text(encoding="utf-8")).get("date", "")
              except Exception:
                  last = ""

          event = os.environ.get("EVENT_NAME", "")
          if event in ("workflow_dispatch", "repository_dispatch"):
              skip, reason = False, "手动/外部触发，直接推送"
          elif last == today:
              skip, reason = True, "今天已推送过（%s），跳过" % last
          elif 10 <= hour <= 14:
              skip, reason = False, "准点窗口（%02d 点）" % hour
          elif 14 < hour <= 22:
              skip, reason = False, "补推窗口（%02d 点，定时被延迟）" % hour
          else:
              skip, reason = True, "%02d 点属非常规时段（可能是提前/严重延迟），跳过" % hour

          print("北京时间 %s | 上次推送：%s | 判定：%s" % (now.strftime("%F %H:%M"), last or "无", reason))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("skip=%s\n" % ("true" if skip else "false"))
          PY

      - name: 生成号码图片
        if: steps.guard.outputs.skip != 'true'
        run: python dlt_card.py 5

      - name: 提交图片并生成公网链接
        id: publish
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -e
          STAMP=$(date +%Y%m%d-%H%M)
          NAME="state/dlt-${STAMP}.png"
          cp state/latest.png "$NAME"
          # 只保留最近 6 张，避免仓库无限膨胀
          ls -1t state/dlt-*.png 2>/dev/null | tail -n +7 | xargs -r git rm --cached -f >/dev/null 2>&1 || true
          ls -1t state/dlt-*.png 2>/dev/null | tail -n +7 | xargs -r rm -f || true

          printf '{"date":"%s","stamp":"%s"}\n' "$(date +%F)" "$STAMP" > state/last_push.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state/ && git add -f state/last_push.json
          git commit -m "chore: 号码图片 ${STAMP}" || echo "无变更"
          git push
          SHA=$(git rev-parse HEAD)
          BASE="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${SHA}"
          echo "candidate=${BASE}/${NAME}" >> "$GITHUB_OUTPUT"

      - name: 等待图片外链生效
        id: cdn
        if: steps.guard.outputs.skip != 'true'
        run: |
          URL="${{ steps.publish.outputs.candidate }}"
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 10 "$URL" || true)
            echo "第 ${i} 次探测：HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then
              echo "image_url=${URL}" >> "$GITHUB_OUTPUT"
              echo "外链可用：$URL"
              exit 0
            fi
            sleep 4
          done
          echo "外链暂不可用，本次退化为文字表格推送"

      - name: 推送到微信
        if: steps.guard.outputs.skip != 'true'
        run: python dlt_serverchan.py state/latest.png "基于历史开奖统计"
        env:
          DLT_IMAGE_URL: ${{ steps.cdn.outputs.image_url }}

      - name: 存档图片
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dlt-latest
          path: state/latest.png
          if-no-files-found: ignore
          retention-days: 14
